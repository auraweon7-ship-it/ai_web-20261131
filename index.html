  function renderInput(parent, key, labelText) {
    var value = parent[key];
    var id = "ed-" + Math.random().toString(36).slice(2);
    if (typeof value === "boolean") {
      var box = h("input", { id: id, type: "checkbox" });
      box.checked = value;
      box.addEventListener("change", function () { parent[key] = box.checked; });
      return h("div", { class: "field" }, [h("label", { class: "check-field", for: id }, [box, h("span", { text: labelText })])]);
    }
    var control;
    var isLong = LONG_FIELDS.indexOf(key) >= 0 || (typeof value === "string" && value.length > 60);
    if (isLong) {
      control = h("textarea", { id: id, rows: "3" });
    } else {
      var type = /^#[0-9a-f]{6}$/i.test(String(value)) ? "color"
        : key === "startDate" || (key === "date" && /^\d{4}-|^$/.test(String(value))) ? "date"
        : typeof value === "number" ? "number" : "text";
      control = h("input", { id: id, type: type });
    }
    control.value = value === null || value === undefined ? "" : value;
    control.addEventListener("input", function () {
      var raw = control.value;
      if (typeof value === "number") parent[key] = raw === "" ? 0 : Number(raw);
      // 비어 있던 숫자 칸(저술 수 등)은 입력하면 숫자가 된다.
      else if (value === null) parent[key] = raw.trim() === "" ? null : isNaN(Number(raw)) ? raw : Number(raw);
      else parent[key] = raw;
    });
    return h("div", { class: "field" }, [h("label", { class: "field-label", for: id, text: labelText }), control]);
  }

  function renderArrayEditor(arr, key) {
    var locked = LOCKED_ARRAYS.indexOf(key) >= 0;
    var box = h("div", { class: "edit-array" });
    function draw() {
      box.textContent = "";
      arr.forEach(function (item, i) {
        var title = key === "weeks" ? (i + 1) + "주차" : editorLabel(key) + " " + (i + 1);
        var row = h("div", { class: "edit-item" }, [
          h("div", { class: "edit-item-head" }, [
            h("span", { class: "detail-title", text: title }),
            locked ? null : (function () {
              var del = h("button", { class: "mini-btn", type: "button", text: "삭제", "aria-label": title + " 삭제" });
              del.addEventListener("click", function () {
                arr.splice(i, 1);
                draw();
              });
              return del;
            })()
          ]),
          typeof item === "object" && item !== null
            ? renderObjectEditor(item, key)
            : renderInput(arr, i, editorLabel(key))
        ]);
        box.appendChild(row);
      });
      var template = arr.length ? arr[arr.length - 1] : ARRAY_TEMPLATES[key];
      if (!locked && template !== undefined) {
        var add = h("button", { class: "btn btn-ghost btn-small", type: "button", text: "＋ " + editorLabel(key) + " 추가" });
        add.addEventListener("click", function () {
          arr.push(blankCopy(template));
          draw();
        });
        box.appendChild(add);
      }
    }
    draw();
    return box;
  }

  function renderObjectEditor(obj, parentKey) {
    var box = h("div", { class: "edit-object" });
    function draw() {
      box.textContent = "";
      Object.keys(obj).forEach(function (key) {
        if (HIDDEN_FIELDS.indexOf(key) >= 0) return;
        // 신청서 항목의 name은 기능과 연결된 값이므로 숨긴다.
        if (key === "name" && parentKey === "fields") return;
        var value = obj[key];
        if (Array.isArray(value)) {
          box.appendChild(h("fieldset", { class: "edit-group" }, [
            h("legend", { text: editorLabel(key) }),
            renderArrayEditor(value, key)
          ]));
        } else if (value && typeof value === "object") {
          box.appendChild(h("fieldset", { class: "edit-group" }, [
            h("legend", { text: editorLabel(key) }),
            renderObjectEditor(value, key)
          ]));
          if (key === "assignment") {

          box.appendChild(renderInput(obj, key, editorLabel(key)));

        var add = h("button", { class: "btn btn-ghost btn-small", type: "button", text: "＋ 이 주차에 과제 추가" });

          draw();
        });
        box.appendChild(add);
      }
    }
    draw();
    return box;
  }

  function adminRosterTab() {
    var roster = C.portal.roster;
    var text = h("textarea", { id: "roster-input", rows: "6", placeholder: "2026000002,홍길동" });
    var file = h("input", { id: "roster-file", type: "file", accept: ".csv,.txt" });

    var add = h("button", { class: "btn btn-primary btn-small", type: "button", text: "명단에 추가" });

    function importLines(raw) {
      var added = 0;
      var skipped = [];
      raw.replace(/^﻿/, "").split(/\r?\n/).forEach(function (line) {
        if (!line.trim()) return;
        var parts = line.split(/[,\t]/).map(function (x) { return x.trim().replace(/^"|"$/g, ""); });
        if (!/^[0-9]{7,10}$/.test(parts[0]) || !parts[1]) {
          skipped.push(line.trim());
          return;
        }
        var existing = roster.filter(function (s) { return s.id === parts[0]; })[0];
        if (existing) existing.name = parts[1];
        else roster.push({ id: parts[0], name: parts[1] });
        added += 1;
      });
      setAdminState({ saved: added + "명을 반영했습니다." + (skipped.length ? " 형식이 맞지 않아 건너뜀: " + skipped.join(" / ") : "") });
      saveConfigAndReload();
    }
    add.addEventListener("click", function () {
      if (text.value.trim()) importLines(text.value);
    });
    file.addEventListener("change", function () {
      if (!file.files[0]) return;
      var reader = new FileReader();
      reader.onload = function () { importLines(String(reader.result)); };
      reader.readAsText(file.files[0], "utf-8");
    });
    var flash = adminState().saved;
    if (flash) {
      message.textContent = flash;
      setAdminState({ saved: "" });
    }

      });
      return h("li", {}, [h("span", { text: s.id + " · " + s.name }), del]);
    }));
    return [
      h("p", { class: "demo-notice", text: "주의: 명단은 사이트 파일에 함께 들어갑니다. 공개 주소에 배포하면 누구나 학번과 이름을 볼 수 있으니, 실제 명단은 서버를 연결한 뒤 사용하세요." }),
      h("div", { class: "field" }, [
        h("label", { class: "field-label", for: "roster-input", text: "한 줄에 한 명씩 \"학번,이름\"" }),

  // 날짜는 "YYYY-MM-DD" 문자열로 다루고, 계산은 UTC로 해서 기기 시간대의 영향을 받지 않게 한다.
  var DOW = ["일", "월", "화", "수", "목", "금", "토"];

  function toUtc(s) {
    var p = s.split("-");
    return new Date(Date.UTC(Number(p[0]), Number(p[1]) - 1, Number(p[2])));
  }
  function fromUtc(d) {
    return d.toISOString().slice(0, 10);
  }
  function addDays(s, n) {
    var d = toUtc(s);
    d.setUTCDate(d.getUTCDate() + n);
    return fromUtc(d);
  }
  function formatDate(s) {
    var d = toUtc(s);
    return (d.getUTCMonth() + 1) + "월 " + d.getUTCDate() + "일 (" + DOW[d.getUTCDay()] + ")";
  }
  function todayString() {
    var n = new Date();
    return fromUtc(new Date(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate())));
  }

  function buildSchedule() {
    var cfg = C.curriculum.schedule;
    var defaults = C.curriculum.assignmentDefaults;
    var offDays = {};
    cfg.skipDates.forEach(function (s) { offDays[s.date] = s.label; });
    var date = cfg.startDate;
    var byDate = {};
    var dueByDate = {};
    var weeks = C.curriculum.weeks.map(function (w) {
      while (offDays[date]) date = addDays(date, 7);
      var item = { week: w, date: date, time: w.time || cfg.time, place: w.place || cfg.place };
      byDate[date] = item;
      if (w.assignment) {
        var a = w.assignment;
        item.dueDate = a.dueDate || addDays(date, a.dueAfterDays === undefined ? defaults.dueAfterDays : a.dueAfterDays);
        item.dueTime = a.dueTime || defaults.dueTime;
        // 마감은 어느 기기에서 보더라도 한국 시간 기준이다.
        item.dueAt = new Date(item.dueDate + "T" + item.dueTime + ":00+09:00").getTime();
        (dueByDate[item.dueDate] = dueByDate[item.dueDate] || []).push(item);
      }
      date = addDays(date, 7);
      return item;
    });
    return { weeks: weeks, byDate: byDate, dueByDate: dueByDate, offDays: offDays };
  }

  var dueUpdaters = [];

  function remainingText(ms) {
    var L = C.curriculum.labels;
    var minutes = Math.floor(ms / 60000);
    if (minutes < 1) return L.soon + " " + L.remaining;
    var days = Math.floor(minutes / 1440);
    var hours = Math.floor((minutes % 1440) / 60);
    var parts = [];
    if (days) parts.push(days + L.day);
    if (hours) parts.push(hours + L.hour);
    if (!days) parts.push((minutes % 60) + L.minute);
    return parts.join(" ") + " " + L.remaining;
  }

  function renderAssignment(item) {
    var L = C.curriculum.labels;
    var a = item.week.assignment;
    var countdown = h("span", { class: "countdown" });
    var action = h("div", {});

    function update() {
      var left = item.dueAt - Date.now();
      var closed = left <= 0;
      countdown.textContent = closed ? L.closed : remainingText(left);
      countdown.className = "countdown" + (closed ? " is-closed" : left < 259200000 ? " is-urgent" : "");
      var state = !closed ? (a.submitUrl ? "link" : "portal") : C.backend.ignoreDeadlines ? "demo" : "closed";
      if (action.getAttribute("data-state") === state) return;
      action.setAttribute("data-state", state);
      action.textContent = "";
      if (state === "link") {
        action.appendChild(h("a", { class: "btn btn-primary btn-small", href: a.submitUrl, target: "_blank", rel: "noopener noreferrer", text: L.submit }));
      } else if (state === "closed") {
        action.appendChild(h("button", { class: "btn btn-small", type: "button", disabled: "disabled", text: L.submitClosed }));
      } else {
        var go = h("button", { class: "btn btn-primary btn-small", type: "button", text: state === "demo" ? L.submitDemo : L.submit });
        go.addEventListener("click", function () { goToSubmit(item.week.week); });
        action.appendChild(go);
      }
    }
    dueUpdaters.push(update);
    update();

    return h("div", { class: "assignment" }, [
      h("p", { class: "detail-title", text: L.assignment }),
      h("p", { class: "assignment-title", text: a.title }),

  function renderCalendar(sched) {
    var d = C.curriculum.calendar;
    var L = C.curriculum.labels;
    var today = todayString();
    var firstMonth = sched.weeks[0].date.slice(0, 7);
    var lastDate = sched.weeks[sched.weeks.length - 1].date;
    Object.keys(sched.dueByDate).forEach(function (date) {
      if (date > lastDate) lastDate = date;
    });
    var lastMonth = lastDate.slice(0, 7);
    // 오늘이 학기 밖이면 가장 가까운 학기 달을 보여 준다.
    var month = today.slice(0, 7);
    if (month < firstMonth) month = firstMonth;
    if (month > lastMonth) month = lastMonth;
    var selected = null;

    var title = h("p", { class: "calendar-month", "aria-live": "polite" });
    var prev = h("button", { class: "slider-btn", type: "button", "aria-label": d.prevLabel, text: "←" });
    var next = h("button", { class: "slider-btn", type: "button", "aria-label": d.nextLabel, text: "→" });
    var grid = h("div", { class: "calendar-grid" });
    var detail = h("div", { class: "card calendar-detail", "aria-live": "polite" });

    function shiftMonth(m, n) {
      var p = m.split("-");
      return fromUtc(new Date(Date.UTC(Number(p[0]), Number(p[1]) - 1 + n, 1))).slice(0, 7);
    }

    function openWeek(week) {
      var el = document.getElementById("week-" + week);
      el.open = true;
      el.classList.add("is-in");
      el.scrollIntoView();
    }

    function showDetail(date) {
      selected = date;
      detail.textContent = "";
      detail.appendChild(h("p", { class: "calendar-detail-date", text: formatDate(date) }));
      var item = sched.byDate[date];
      if (item) {
        var w = item.week;
        detail.appendChild(h("h4", { class: "card-title", style: "margin:0", text: w.week + C.ui.weekSuffix + " · " + w.title }));
        detail.appendChild(infoList([
          { label: L.time, value: item.time },
          { label: L.place, value: item.place }
        ]));
        detail.appendChild(h("ul", { class: "content-list" }, w.contents.map(function (c) {
          return h("li", { text: c });
        })));
        var link = h("button", { class: "calendar-link", type: "button", text: w.week + d.openWeek });
        link.addEventListener("click", function () { openWeek(w.week); });
        detail.appendChild(link);
      } else {
        detail.appendChild(h("p", { class: "card-text", text: sched.offDays[date] || d.noClass }));
      }
      (sched.dueByDate[date] || []).forEach(function (due) {
        detail.appendChild(h("p", { class: "assignment-due", text: d.dueNotice + due.week.assignment.title + " (" + due.week.week + C.ui.weekSuffix + ", " + due.dueTime + ")" }));
      });
    }

    function drawMonth() {
      var p = month.split("-");
      title.textContent = Number(p[0]) + "년 " + Number(p[1]) + "월";
      prev.disabled = month <= firstMonth;
      next.disabled = month >= lastMonth;
      grid.textContent = "";
      DOW.forEach(function (name) {
        grid.appendChild(h("div", { class: "calendar-dow", "aria-hidden": "true", text: name }));
      });
      var first = month + "-01";
      for (var i = 0; i < toUtc(first).getUTCDay(); i++) grid.appendChild(h("div", {}));
      var date = first;
      while (date.slice(0, 7) === month) {
        grid.appendChild(renderDay(date));
        date = addDays(date, 1);
      }
    }

    function renderDay(date) {
      var item = sched.byDate[date];
      var off = sched.offDays[date];
      var dues = sched.dueByDate[date];
      var cls = "calendar-day"
        + (item ? " is-class" : "")
        + (item && item.week.exam ? " is-exam" : "")
        + (off ? " is-off" : "")
        + (date === today ? " is-today" : "")
        + (date === selected ? " is-selected" : "");
      var label = formatDate(date)
        + (item ? ", " + item.week.week + C.ui.weekSuffix + " " + item.week.title : "")
        + (off ? ", " + off : "")
        + (dues ? ", " + C.curriculum.calendar.legendDue : "");
      var btn = h("button", { class: cls, type: "button", "aria-label": label, "aria-pressed": String(date === selected) }, [
        h("span", { text: String(toUtc(date).getUTCDate()) }),
        item ? h("span", { class: "calendar-tag", text: item.week.week + "주" }) : null,
        off ? h("span", { class: "calendar-tag is-off", text: "휴강" }) : null,
        dues ? h("span", { class: "calendar-due", "aria-hidden": "true" }) : null
      ]);
      btn.addEventListener("click", function () {
        showDetail(date);
        drawMonth();
      });
      return btn;
    }

    // 달을 바꾸면 그 달의 다음 수업(없으면 첫 수업)을 선택한다.
    function pickDate() {
      var classes = sched.weeks.filter(function (x) { return x.date.slice(0, 7) === month; });
      var upcoming = classes.filter(function (x) { return x.date >= today; })[0];
      var pick = upcoming || classes[0];
      return pick ? pick.date : month + "-01";
    }

    function goMonth(n) {
      month = shiftMonth(month, n);
      showDetail(pickDate());
      drawMonth();
    }
    prev.addEventListener("click", function () { goMonth(-1); });
    next.addEventListener("click", function () { goMonth(1); });

    showDetail(pickDate());
    drawMonth();

    return h("div", { class: "calendar-block", id: "calendar" }, [
      h("h3", { class: "section-title reveal", text: d.title }),
      h("p", { class: "section-sub reveal", text: d.intro }),
      h("div", { class: "calendar-layout reveal" }, [
        h("div", { class: "card calendar" }, [
          h("div", { class: "calendar-head" }, [prev, title, next]),
          grid,
          h("div", { class: "calendar-legend" }, [
            h("span", { class: "legend-item" }, [h("span", { class: "legend-swatch" }), document.createTextNode(d.legendClass)]),
            h("span", { class: "legend-item" }, [h("span", { class: "legend-swatch is-exam" }), document.createTextNode(d.legendExam)]),
            h("span", { class: "legend-item" }, [h("span", { class: "legend-swatch is-due" }), document.createTextNode(d.legendDue)])
          ])
        ]),
        detail
      ])
    ]);
  }

  function renderCurriculum() {
    var d = C.curriculum;
    var sched = buildSchedule();
    var body = h("div", {}, [
      h("ol", { class: "week-list" }, sched.weeks.map(renderWeek)),
      renderCalendar(sched)
    ]);
    setInterval(function () {
      dueUpdaters.forEach(function (update) { update(); });
    }, 30000);
    return section("curriculum", false, sectionHead(d), body);
  }

  function renderGuide() {
    var d = C.guide;
    return section("guide", true, sectionHead(d), h("div", { class: "guide-grid" }, [
      h("article", { class: "card reveal" }, [
        h("h3", { class: "card-title", text: d.infoTitle }),
        infoList(d.info)
      ]),
      h("article", { class: "card reveal" }, [
        h("h3", { class: "card-title", text: d.gradingTitle }),
        h("p", { class: "grade-note", text: d.gradingNote }),
        h("ul", { class: "grade-list" }, d.grading.map(function (g) {
          var fill = h("span", {});
          fill.style.width = g.percent + "%";
          return h("li", {}, [
            h("div", { class: "grade-head" }, [
              h("span", { text: g.label }),
              h("span", { class: "grade-value", text: g.percent + "%" })
            ]),
            h("div", { class: "grade-bar", "aria-hidden": "true" }, [fill])
          ]);
        }))
      ])
    ]));
  }

  function renderFaq() {
    var d = C.faq;
    return section("faq", false, sectionHead(d), h("div", { class: "faq-list" }, d.items.map(function (item) {
      return h("details", { class: "faq-item reveal" }, [
        h("summary", { text: item.q }),
        h("p", { class: "faq-answer", text: item.a })
      ]);
    })));
  }

  function instructorPhoto(d) {
    var glyph = h("div", { class: "instructor-glyph", lang: "zh-Hant", "aria-hidden": "true", text: d.glyph });
    if (!d.photo) return glyph;
    var img = h("img", { class: "instructor-photo", src: d.photo, alt: d.photoAlt });
    // 사진을 찾지 못하면 한자 원형으로 되돌린다.
    img.addEventListener("error", function () { img.replaceWith(glyph); });
    return img;
  }

  function contactList(d) {
    return h("dl", { class: "info-list" }, d.contacts.map(function (c) {
      var value = c.email
        ? h("a", { href: "mailto:" + c.email, text: c.email })
        : document.createTextNode(c.value || d.emptyText);
      return h("div", { class: "info-row" }, [
        h("dt", { text: c.label }),
        h("dd", {}, [value])
      ]);
    }));
  }

  function renderFooter() {
    var d = C.instructor;
    return h("footer", { class: "site-footer", id: "instructor" }, [
      h("div", { class: "wrap" }, [
        h("p", { class: "section-label", text: d.label }),
        h("div", { class: "footer-profile" }, [
          instructorPhoto(d),
          h("div", {}, [
            h("h2", { class: "instructor-name", text: d.name }),
            h("p", { class: "instructor-role", text: d.role }),
            h("p", { class: "instructor-bio", text: d.bio })
          ]),
          h("div", { class: "footer-contact" }, [
            h("h3", { class: "card-title", text: d.contactTitle }),
            contactList(d)
          ])
        ])
      ]),
      h("div", { class: "wrap footer-row" }, [
        h("span", { text: C.footer.text }),
        h("span", { text: C.footer.note })
      ])
    ]);
  }

  function setupToTop() {
    var btn = h("button", { class: "to-top", type: "button", "aria-label": C.ui.toTop, title: C.ui.toTop });
    btn.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
    btn.addEventListener("click", function () {
      window.scrollTo({ top: 0 });
    });
    document.body.appendChild(btn);

    var header = document.querySelector(".site-header");
    function onScroll() {
      var y = window.scrollY;
      btn.classList.toggle("is-visible", y > 400);
      header.classList.toggle("is-scrolled", y > 8);
    }
    window.addEventListener("scroll", onScroll, { passive: true });
    onScroll();
  }

  function setupActiveNav() {
    var links = document.querySelectorAll("[data-nav]");
    var targets = Array.prototype.slice.call(document.querySelectorAll("main > section, .site-footer"));
    function update() {
      var current = null;
      var doc = document.documentElement;
      if (window.scrollY + window.innerHeight >= doc.scrollHeight - 2) {
        // 페이지 끝에서는 마지막 영역(푸터)이 화면 중앙에 오지 못해도 강조한다.
        current = targets[targets.length - 1];
      } else {
        // 메뉴에 없는 섹션이 화면 중앙에 있으면 강조를 지운다.
        var middle = window.innerHeight / 2;
        current = targets.filter(function (t) {
          var r = t.getBoundingClientRect();
          return r.top <= middle && r.bottom > middle;
        })[0];
      }
      links.forEach(function (link) {
        var active = !!current && link.getAttribute("data-nav") === current.id;
        link.classList.toggle("is-active", active);
        if (active) link.setAttribute("aria-current", "true");
        else link.removeAttribute("aria-current");
      });
    }
    window.addEventListener("scroll", update, { passive: true });
    window.addEventListener("resize", update);
    update();
  }

  function setupReveal() {
    if (!("IntersectionObserver" in window)) return;
    document.documentElement.classList.add("js-reveal");
    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) return;
        entry.target.classList.add("is-in");
        observer.unobserve(entry.target);
      });
    }, { threshold: 0.08 });
    document.querySelectorAll(".reveal").forEach(function (el) {
      observer.observe(el);
    });
  }

  function setupCountUp() {
    var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduced || !("IntersectionObserver" in window)) return;
    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) return;
        observer.unobserve(entry.target);
        var el = entry.target;
        var end = Number(el.getAttribute("data-count"));
        var start = performance.now();
        function tick(now) {
          var t = Math.min((now - start) / 900, 1);
          el.textContent = String(Math.round(end * (1 - Math.pow(1 - t, 3))));
          if (t < 1) requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
      });
    }, { threshold: 0.5 });
    document.querySelectorAll("[data-count]").forEach(function (el) {
      observer.observe(el);
    });
  }

  document.title = C.meta.title;
  var description = document.createElement("meta");
  description.name = "description";
  description.content = C.meta.description;
  document.head.appendChild(description);
  applyTheme(C.theme);

  root.appendChild(h("a", { class: "skip", href: "#main", text: C.ui.skip }));
  root.appendChild(renderHeader());
  root.appendChild(h("main", { id: "main" }, [
    renderHero(),
    renderNotices(),
    renderStats(),
    renderAbout(),
    renderPoll(),
    renderCurriculum(),
    renderGuide(),
    renderApply(),
    renderPortal(),
    renderTools(),
    renderPrepare(),
    renderFaq()
  ]));
  root.appendChild(renderFooter());

  setupToTop();
  setupActiveNav();
  setupReveal();
  setupCountUp();
  restoreAdminSession();
  // QR로 들어온 학생은 입장 칸부터 보이게 한다. 글꼴·이미지로 위치가 바뀌므로 로드 후에도 맞춘다.
  if (QUIZ_CODE) {
    var scrollToQuiz = function () {
      document.getElementById("quiz").scrollIntoView({ behavior: "instant" });
    };
    scrollToQuiz();
    window.addEventListener("load", scrollToQuiz);
  }
  launchConfetti();
  setupPopup();
})();
</script>
</body>
</html>
