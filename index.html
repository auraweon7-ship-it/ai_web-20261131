<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>교양중국어</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'><rect width='48' height='48' rx='11' fill='%2314534f'/><rect x='12' y='16' width='24' height='15' rx='2.5' fill='none' stroke='%23fff' stroke-width='3.2'/><path d='M24 10v28' stroke='%23fff' stroke-width='3.2' stroke-linecap='round'/><circle cx='24' cy='8' r='3.4' fill='%23e8b95a'/><circle cx='24' cy='40' r='3.4' fill='%23e8b95a'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@700;900&family=Noto+Serif+SC:wght@500;700&display=swap">
<style>
:root {
  /* 색상 값은 아래 사이트 설정의 theme에서 덮어씁니다. */
  --primary: #14534f;
  --primary-deep: #0d3d3a;
  --violet: #8a5a14;
  --blossom: #d8e6e0;
  --lilac: #efe3c8;
  --bg: #f4eee3;
  --surface: #f8f3ea;
  --text: #27322f;
  --muted: #5c6862;
  --line: #e4dbcb;

  --font-display: "Noto Serif KR", "Apple SD Gothic Neo", "Malgun Gothic", serif;
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-hanzi: "Noto Serif SC", "Songti SC", "SimSun", serif;

  --header-h: 68px;
  --radius-lg: 24px;
  --radius-md: 16px;
  --shadow: 6px 6px 16px rgba(160, 145, 118, 0.32), -6px -6px 16px rgba(255, 255, 255, 0.85);
  --shadow-small: 3px 3px 8px rgba(160, 145, 118, 0.3), -3px -3px 8px rgba(255, 255, 255, 0.8);
  --shadow-inset: inset 3px 3px 7px rgba(160, 145, 118, 0.28), inset -3px -3px 7px rgba(255, 255, 255, 0.8);
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

*, *::before, *::after { box-sizing: border-box; }

html {
  scroll-behavior: smooth;
  scroll-padding-top: calc(var(--header-h) + 16px);
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  overflow-x: clip;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 1rem;
  line-height: 1.7;
  word-break: keep-all;
  overflow-wrap: break-word;
}

h1, h2, h3, p, ul, dl, dd { margin: 0; padding: 0; }
ul { list-style: none; }
a { color: inherit; }

:focus-visible {
  outline: 3px solid var(--violet);
  outline-offset: 3px;
  border-radius: 8px;
}

.skip {
  position: fixed;
  top: -60px;
  left: 16px;
  z-index: 100;
  padding: 10px 18px;
  border-radius: 999px;
  background: var(--primary-deep);
  color: #fff;
  transition: top 0.2s;
}
.skip:focus { top: 10px; }

.wrap {
  width: 100%;
  max-width: 1120px;
  margin-inline: auto;
  padding-inline: clamp(16px, 5vw, 40px);
}

/* 헤더 */
.site-header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  border-bottom: 1px solid transparent;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.site-header.is-scrolled {
  border-color: var(--line);
  box-shadow: 0 6px 20px color-mix(in srgb, var(--primary) 7%, transparent);
}
.header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  height: var(--header-h);
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  min-height: 44px;
  text-decoration: none;
}
.brand-glyph {
  flex: none;
  display: grid;
  place-items: center;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: var(--blossom);
  color: var(--primary-deep);
  font-family: var(--font-hanzi);
  font-size: 1.25rem;
  font-weight: 700;
}
.brand-text { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
.brand-org { font-size: 0.75rem; color: var(--muted); }
.brand-name { font-family: var(--font-display); font-size: 1.1rem; font-weight: 700; }

.nav-list { display: flex; gap: 4px; }
.nav-link {
  display: flex;
  align-items: center;
  min-height: 44px;
  padding: 0 14px;
  border-radius: 999px;
  color: var(--muted);
  font-size: 0.95rem;
  text-decoration: none;
  transition: background-color 0.2s, color 0.2s;
}
.nav-link:hover { background: color-mix(in srgb, var(--blossom) 45%, transparent); color: var(--text); }
.nav-link.is-active { background: var(--blossom); color: var(--primary-deep); font-weight: 700; }

.menu-toggle {
  display: none;
  flex: none;
  width: 44px;
  height: 44px;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: var(--surface);
  color: var(--primary-deep);
  cursor: pointer;
}
.menu-toggle span,
.menu-toggle span::before,
.menu-toggle span::after {
  display: block;
  width: 18px;
  height: 2px;
  margin-inline: auto;
  border-radius: 2px;
  background: currentColor;
  transition: transform 0.2s, background-color 0.2s;
}
.menu-toggle span { position: relative; }
.menu-toggle span::before, .menu-toggle span::after { content: ""; position: absolute; left: 0; }
.menu-toggle span::before { top: -6px; }
.menu-toggle span::after { top: 6px; }
.menu-toggle[aria-expanded="true"] span { background: transparent; }
.menu-toggle[aria-expanded="true"] span::before { transform: translateY(6px) rotate(45deg); }
.menu-toggle[aria-expanded="true"] span::after { transform: translateY(-6px) rotate(-45deg); }

/* 히어로 */
.hero {
  position: relative;
  overflow: hidden;
  padding-block: clamp(48px, 9vw, 104px) clamp(56px, 9vw, 112px);
  background:
    radial-gradient(60% 70% at 88% 12%, color-mix(in srgb, var(--lilac) 75%, transparent), transparent 70%),
    radial-gradient(55% 65% at 8% 88%, color-mix(in srgb, var(--blossom) 70%, transparent), transparent 70%);
}
.hero-grid {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: minmax(0, 1.35fr) minmax(0, 0.85fr);
  align-items: center;
  gap: clamp(32px, 6vw, 72px);
}
.eyebrow {
  color: var(--primary);
  font-size: 0.95rem;
  font-weight: 700;
  letter-spacing: 0.04em;
}
.hero h1 {
  margin-top: 14px;
  font-family: var(--font-display);
  font-size: clamp(2.3rem, 6.2vw, 4.3rem);
  font-weight: 700;
  line-height: 1.2;
  letter-spacing: -0.02em;
  white-space: pre-line;
}
.hero-lead {
  max-width: 34em;
  margin-top: 20px;
  color: var(--muted);
  font-size: clamp(1.02rem, 1.6vw, 1.15rem);
}
.hero-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 50px;
  padding: 0 26px;
  border: 1px solid transparent;
  border-radius: 999px;
  font-weight: 700;
  text-decoration: none;
  transition: transform 0.2s var(--ease), background-color 0.2s;
}
.btn:hover { transform: translateY(-2px); }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-deep); }
.btn-ghost { background: var(--surface); border-color: var(--blossom); color: var(--primary-deep); }

/* 한자가 카드 밖으로 살짝 넘치는 히어로 카드 */
.hero-card {
  position: relative;
  padding: clamp(28px, 4vw, 40px);
  border-radius: var(--radius-lg);
  background: var(--surface);
  box-shadow: var(--shadow);
  transform: rotate(1.5deg);
}
.hero-card::before {
  content: attr(data-glyph);
  position: absolute;
  top: -0.42em;
  right: 0.12em;
  color: var(--lilac);
  font-family: var(--font-hanzi);
  font-size: clamp(5rem, 11vw, 8rem);
  font-weight: 700;
  line-height: 1;
}
.hero-hanzi {
  position: relative;
  margin-top: 28px;
  font-family: var(--font-hanzi);
  font-size: clamp(3rem, 7vw, 4.6rem);
  font-weight: 700;
  line-height: 1.15;
  color: var(--primary-deep);
}
.hero-pinyin { margin-top: 8px; color: var(--violet); font-size: 1.2rem; font-weight: 700; }
.hero-meaning { color: var(--muted); }

/* 섹션 */
.section { padding-block: clamp(56px, 8vw, 96px); }
.section-alt { background: color-mix(in srgb, var(--lilac) 22%, var(--bg)); }
.section-head { max-width: 640px; margin-bottom: clamp(28px, 4vw, 44px); }
.section-label { color: var(--primary); font-size: 0.9rem; font-weight: 700; letter-spacing: 0.04em; }
.section-title {
  margin-top: 6px;
  font-family: var(--font-display);
  font-size: clamp(1.75rem, 3.6vw, 2.5rem);
  font-weight: 700;
  line-height: 1.3;
  letter-spacing: -0.01em;
  text-wrap: balance;
}
.section-sub { margin-top: 12px; color: var(--muted); }

.card {
  padding: clamp(22px, 3vw, 30px);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: var(--surface);
}
.card-title { font-family: var(--font-display); font-size: 1.25rem; font-weight: 700; line-height: 1.4; }

/* 히어로 배지·부제·요약 */
.hero-badge {
  display: inline-block;
  padding: 6px 16px;
  border-radius: 999px;
  background: var(--primary-deep);
  color: #fff;
  font-size: 0.9rem;
  font-weight: 700;
}
.hero-subtitle {
  margin-top: 10px;
  color: var(--violet);
  font-family: var(--font-display);
  font-size: clamp(1.2rem, 2.6vw, 1.7rem);
  font-weight: 700;
  line-height: 1.35;
}
.facts {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 14px;
  margin-top: clamp(36px, 5vw, 56px);
}
.fact {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  background: var(--surface);
}
.fact-glyph {
  flex: none;
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: color-mix(in srgb, var(--lilac) 60%, transparent);
  color: var(--violet);
  font-family: var(--font-hanzi);
  font-size: 1.2rem;
  font-weight: 700;
}
.fact dt { color: var(--muted); font-size: 0.85rem; }
.fact dd { font-weight: 700; line-height: 1.4; }

/* 통계 */
.stats { padding-top: clamp(40px, 6vw, 64px); }
.stats-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.stat-card {
  padding: clamp(20px, 3vw, 30px) 16px;
  border-radius: var(--radius-lg);
  background: linear-gradient(150deg, color-mix(in srgb, var(--blossom) 55%, var(--surface)), color-mix(in srgb, var(--lilac) 60%, var(--surface)));
  text-align: center;
}
.stat-value { display: flex; align-items: baseline; justify-content: center; gap: 4px; min-height: 3.4rem; color: var(--primary-deep); font-family: var(--font-display); font-weight: 700; }
.stat-num { font-size: clamp(2.4rem, 5vw, 3.4rem); line-height: 1.15; font-variant-numeric: tabular-nums; }
.stat-num.is-empty { align-self: center; color: var(--muted); font-family: var(--font-body); font-size: 1rem; font-weight: 400; }
.stat-suffix { font-size: 1.2rem; }
.stat-label { margin-top: 4px; color: var(--text); font-size: 0.95rem; }

/* 장점 슬라이드 */
.slider-track {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: calc((100% - 40px) / 3);
  column-gap: 20px;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  overscroll-behavior-x: contain;
  scrollbar-width: none;
  padding-block: 2px;
  border-radius: var(--radius-lg);
}
.slider-track::-webkit-scrollbar { display: none; }
.slide { scroll-snap-align: start; }
.slider-controls { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 20px; }
.slider-btn {
  width: 48px;
  height: 48px;
  border: 1px solid var(--blossom);
  border-radius: 50%;
  background: var(--surface);
  color: var(--primary-deep);
  font-size: 1.2rem;
  cursor: pointer;
  transition: background-color 0.2s;
}
.slider-btn:hover:not(:disabled) { background: var(--blossom); }
.slider-btn:disabled { opacity: 0.4; cursor: default; }
.slider-status { min-width: 3.5em; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }

/* 실습 도구 */
.tool-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 16px; }
.tool-card { display: flex; flex-direction: column; }
.tool-maker { color: var(--violet); font-size: 0.85rem; font-weight: 700; }
.tool-card .card-text { flex: 1; }
.tool-link {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin-top: 8px;
  color: var(--primary-deep);
  font-weight: 700;
}

/* 수강 준비물 */
.prepare-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.prepare-card { display: flex; align-items: flex-start; gap: 16px; }
.prepare-card .glyph-badge { flex: none; margin-bottom: 0; }

/* 공통 원형 한자 */
.glyph-badge {
  display: grid;
  place-items: center;
  width: 60px;
  height: 60px;
  margin-bottom: 18px;
  border-radius: 50%;
  background: color-mix(in srgb, var(--blossom) 60%, transparent);
  color: var(--primary-deep);
  font-family: var(--font-hanzi);
  font-size: 1.7rem;
  font-weight: 700;
}
.slide:nth-child(even) .glyph-badge { background: color-mix(in srgb, var(--lilac) 70%, transparent); color: var(--violet); }
.card-text { margin-top: 8px; color: var(--muted); }

/* 커리큘럼 */
.week-list { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.week-item {
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  background: var(--surface);
  scroll-margin-top: calc(var(--header-h) + 16px);
  transition: border-color 0.2s;
}
.week-item:hover, .week-item[open] { border-color: var(--blossom); }
.week-item.is-exam { background: color-mix(in srgb, var(--lilac) 40%, var(--surface)); border-color: var(--lilac); }
.week-summary {
  display: grid;
  grid-template-columns: 4.2em minmax(0, 1fr) auto;
  align-items: center;
  gap: 4px 12px;
  min-height: 64px;
  padding: 12px 20px;
  border-radius: var(--radius-md);
  cursor: pointer;
  list-style: none;
}
.week-summary::-webkit-details-marker { display: none; }
.week-num { color: var(--primary); font-size: 0.95rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.week-heading { min-width: 0; }
.week-title { font-family: var(--font-display); font-size: 1.1rem; font-weight: 700; line-height: 1.4; }
.week-date { color: var(--muted); font-size: 0.88rem; }
.week-marks { display: flex; align-items: center; gap: 8px; }
.week-marks::after {
  content: "+";
  color: var(--primary);
  font-size: 1.5rem;
  line-height: 1;
  transition: transform 0.2s var(--ease);
}
.week-item[open] .week-marks::after { transform: rotate(45deg); }
.badge { padding: 2px 10px; border-radius: 999px; background: var(--violet); color: #fff; font-size: 0.78rem; font-weight: 700; white-space: nowrap; }
.badge-task { background: var(--primary); }
.week-body { display: grid; gap: 18px; padding: 4px 20px 22px; }
.week-meta { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.week-meta div { padding: 10px 14px; border-radius: 14px; background: color-mix(in srgb, var(--blossom) 22%, var(--bg)); }
.week-meta dt { color: var(--muted); font-size: 0.82rem; }
.week-meta dd { font-weight: 700; line-height: 1.4; }
.detail-title { margin-bottom: 6px; color: var(--primary-deep); font-size: 0.92rem; font-weight: 700; }
.content-list { display: grid; gap: 4px; }
.content-list li { position: relative; padding-left: 16px; }
.content-list li::before {
  content: "";
  position: absolute;
  top: 0.7em;
  left: 2px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--blossom);
}
.week-phrase { margin-top: 10px; padding: 10px 14px; border-radius: 14px; border: 1px dashed var(--line); }
.hanzi { font-family: var(--font-hanzi); font-size: 1.15rem; font-weight: 500; line-height: 1.4; }
.pinyin { color: var(--violet); font-size: 0.9rem; }
.video-link { display: inline-flex; align-items: center; min-height: 44px; color: var(--primary-deep); font-weight: 700; }
.assignment {
  padding: 16px 18px;
  border: 1px solid var(--blossom);
  border-radius: 16px;
  background: color-mix(in srgb, var(--blossom) 16%, var(--surface));
}
.assignment-title { font-weight: 700; }
.assignment-text { margin-top: 2px; color: var(--muted); }
.assignment-due { margin-top: 10px; font-size: 0.95rem; }
.assignment-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-top: 12px; }
.countdown {
  padding: 4px 12px;
  border-radius: 999px;
  background: var(--lilac);
  color: var(--primary-deep);
  font-size: 0.9rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.countdown.is-urgent { background: var(--primary); color: #fff; }
.countdown.is-closed { background: var(--line); color: var(--muted); }
.btn-small { min-height: 44px; padding: 0 20px; font-size: 0.95rem; font-family: inherit; cursor: pointer; }
.btn:disabled { background: var(--line); color: var(--muted); cursor: not-allowed; transform: none; }
.submit-note { color: var(--muted); font-size: 0.85rem; }

/* 달력 */
.calendar-block { margin-top: clamp(40px, 6vw, 64px); scroll-margin-top: calc(var(--header-h) + 16px); }
.calendar-layout { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 20px; align-items: start; margin-top: 18px; }
.calendar { padding: clamp(14px, 2.5vw, 24px); }
.calendar-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.calendar-month { font-family: var(--font-display); font-size: 1.25rem; font-weight: 700; }
.calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.calendar-dow { padding-block: 4px; color: var(--muted); font-size: 0.82rem; text-align: center; }
.calendar-day {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: 1px;
  min-height: 62px;
  padding: 6px 1px;
  border: 1px solid transparent;
  border-radius: 12px;
  background: transparent;
  color: var(--text);
  font: inherit;
  cursor: pointer;
  transition: background-color 0.2s;
}
.calendar-day:hover { background: color-mix(in srgb, var(--blossom) 28%, transparent); }
.calendar-day.is-class { background: color-mix(in srgb, var(--blossom) 45%, var(--surface)); font-weight: 700; }
.calendar-day.is-exam { background: color-mix(in srgb, var(--lilac) 75%, var(--surface)); }
.calendar-day.is-off { color: var(--muted); }
.calendar-day.is-today { border-color: var(--violet); }
.calendar-day.is-selected { outline: 2px solid var(--primary); outline-offset: -2px; }
.calendar-tag { color: var(--primary-deep); font-size: 0.72rem; font-weight: 700; line-height: 1.25; }
.calendar-tag.is-off { color: var(--muted); font-weight: 400; }
.calendar-due { width: 7px; height: 7px; border-radius: 50%; background: var(--violet); }
.calendar-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 12px; color: var(--muted); font-size: 0.85rem; }
.legend-item { display: inline-flex; align-items: center; gap: 6px; }
.legend-swatch { width: 12px; height: 12px; border-radius: 4px; background: var(--blossom); }
.legend-swatch.is-exam { background: var(--lilac); }
.legend-swatch.is-due { border-radius: 50%; background: var(--violet); }
.calendar-detail { display: grid; gap: 10px; }
.calendar-detail-date { color: var(--primary); font-weight: 700; }
.calendar-detail .info-list { margin-top: 0; }
.calendar-link { display: inline-flex; align-items: center; min-height: 44px; padding: 0; border: 0; background: none; color: var(--primary-deep); font: inherit; font-weight: 700; text-decoration: underline; cursor: pointer; }

/* 수강 안내 */
.guide-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr); gap: 20px; align-items: start; }
.info-list { margin-top: 14px; }
.info-row {
  display: grid;
  grid-template-columns: 7.5em minmax(0, 1fr);
  gap: 12px;
  padding-block: 12px;
  border-top: 1px solid var(--line);
}
.info-row:first-child { border-top: 0; }
.info-row dt { color: var(--muted); font-size: 0.95rem; }
.info-row dd { font-weight: 700; }
.grade-note { margin-top: 6px; color: var(--muted); font-size: 0.9rem; }
.grade-list { display: grid; gap: 14px; margin-top: 18px; }
.grade-head { display: flex; justify-content: space-between; gap: 12px; }
.grade-value { font-weight: 700; color: var(--primary-deep); font-variant-numeric: tabular-nums; }
.grade-bar { height: 10px; margin-top: 6px; border-radius: 999px; background: color-mix(in srgb, var(--blossom) 35%, transparent); overflow: hidden; }
.grade-bar span { display: block; height: 100%; border-radius: inherit; background: var(--primary); }

/* FAQ */
.faq-list { display: grid; gap: 12px; max-width: 800px; }
.faq-item { border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface); }
.faq-item summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  min-height: 56px;
  padding: 14px 22px;
  border-radius: var(--radius-md);
  font-weight: 700;
  cursor: pointer;
  list-style: none;
}
.faq-item summary::-webkit-details-marker { display: none; }
.faq-item summary::after {
  content: "+";
  flex: none;
  color: var(--primary);
  font-size: 1.5rem;
  line-height: 1;
  transition: transform 0.2s var(--ease);
}
.faq-item[open] summary::after { transform: rotate(45deg); }
.faq-answer { padding: 0 22px 20px; color: var(--muted); }

/* 교수자 */
.footer-profile {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) minmax(0, 0.9fr);
  gap: clamp(20px, 4vw, 40px);
  align-items: center;
  margin-top: 14px;
}
.instructor-photo {
  display: block;
  width: clamp(110px, 16vw, 160px);
  aspect-ratio: 1;
  border-radius: 50%;
  object-fit: cover;
}
.footer-contact { min-width: 0; }
.instructor-works { margin-top: 28px; }
.works-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 4px 24px; margin: 12px 0 0; padding: 0; list-style: none; }
.works-list a { display: flex; align-items: center; min-height: 44px; color: var(--primary); text-decoration: underline; text-underline-offset: 2px; overflow-wrap: anywhere; }
.instructor-glyph {
  display: grid;
  place-items: center;
  width: clamp(110px, 16vw, 160px);
  aspect-ratio: 1;
  border-radius: 50%;
  background: linear-gradient(145deg, var(--blossom), var(--lilac));
  color: var(--primary-deep);
  font-family: var(--font-hanzi);
  font-size: clamp(3rem, 7vw, 4.6rem);
  font-weight: 700;
}
.instructor-name { font-family: var(--font-display); font-size: 1.5rem; font-weight: 700; line-height: 1.35; }
.instructor-role { color: var(--primary); font-weight: 700; }
.instructor-bio { margin-top: 10px; color: var(--muted); white-space: pre-line; }

/* 푸터 */
.site-footer { padding-block: clamp(44px, 6vw, 64px) 28px; background: color-mix(in srgb, var(--blossom) 28%, var(--bg)); border-top: 1px solid var(--line); }
.footer-row { display: grid; gap: 6px; margin-top: 36px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.9rem; text-align: center; overflow-wrap: anywhere; }
.footer-row a { color: var(--primary); text-decoration: underline; text-underline-offset: 2px; }

/* 맨 위로 */
.to-top {
  position: fixed;
  right: max(16px, env(safe-area-inset-right));
  bottom: max(16px, env(safe-area-inset-bottom));
  z-index: 40;
  display: grid;
  place-items: center;
  width: 50px;
  height: 50px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: var(--primary);
  color: #fff;
  box-shadow: var(--shadow);
  cursor: pointer;
  opacity: 0;
  visibility: hidden;
  transform: translateY(10px);
  transition: opacity 0.25s, transform 0.25s var(--ease), visibility 0.25s;
}
.to-top.is-visible { opacity: 1; visibility: visible; transform: none; }
.to-top:hover { background: var(--primary-deep); }

/* 스크롤 등장 */
.js-reveal .reveal { opacity: 0; transform: translateY(18px); transition: opacity 0.6s var(--ease), transform 0.6s var(--ease); }
.js-reveal .reveal.is-in { opacity: 1; transform: none; }

/* 공지 */
.notices { padding-top: clamp(28px, 4vw, 40px); }
.notice-list { display: grid; gap: 10px; }
.notice-item { padding: 16px 20px; border: 1px solid var(--blossom); border-radius: var(--radius-md); background: var(--surface); }
.notice-date { color: var(--primary); font-size: 0.85rem; font-weight: 700; }
.notice-pager { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 14px; }
.notice-page-btn { min-width: 44px; min-height: 44px; padding: 0 10px; border: 0; border-radius: 12px; background: var(--bg); box-shadow: var(--shadow-small); color: var(--primary); font: inherit; font-weight: 700; cursor: pointer; }
.notice-page-btn.is-current { background: var(--primary); box-shadow: none; color: #fff; }
.notice-page-btn:disabled { box-shadow: none; color: var(--muted); opacity: 0.5; cursor: default; }
.notice-actions { display: flex; flex: none; flex-wrap: wrap; justify-content: flex-end; gap: 6px; margin-left: auto; }
.roster-list li:has(.notice-actions) { flex-wrap: wrap; }
.roster-list li:has(.notice-actions) > span:first-child { flex: 1 1 200px; }
.btn[hidden] { display: none; }
.notice-title { font-family: var(--font-display); font-size: 1.1rem; font-weight: 700; }
.notice-body { margin-top: 4px; color: var(--muted); white-space: pre-line; }

/* 관리자 */
.header-actions { display: flex; flex: none; align-items: center; gap: 8px; }
.header-login { display: flex; align-items: center; gap: 8px; }
.header-login .btn { min-height: 44px; padding: 0 14px; font-family: inherit; white-space: nowrap; cursor: pointer; }
.header-login-name { max-width: 8em; overflow: hidden; color: var(--primary-deep); font-size: 0.9rem; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
.lock-btn {
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: var(--surface);
  color: var(--primary-deep);
  cursor: pointer;
  transition: background-color 0.2s;
}
.lock-btn:hover { background: var(--blossom); }
.admin-login { display: grid; gap: 14px; }
.admin {
  width: min(960px, calc(100vw - 24px));
  height: min(88vh, 900px);
  height: min(88dvh, 900px);
  max-height: none;
  padding: 0;
  border: 0;
  border-radius: var(--radius-lg);
  background: var(--bg);
  color: var(--text);
  box-shadow: var(--shadow);
}
.admin[open] { display: flex; flex-direction: column; }
.admin::backdrop { background: rgba(13, 61, 58, 0.5); }
.admin-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 16px 20px 10px; }
.admin-buttons { display: flex; flex-wrap: wrap; gap: 8px; }
.admin-buttons .btn, .admin-panel .btn { font-family: inherit; cursor: pointer; }
.admin-buttons .btn { cursor: pointer; font-family: inherit; }
.admin-tabs { display: flex; flex: none; gap: 4px; padding: 0 20px 10px; overflow-x: auto; border-bottom: 1px solid var(--line); }
.admin-tab {
  flex: none;
  min-height: 44px;
  padding: 0 14px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--muted);
  font: inherit;
  cursor: pointer;
}
.admin-tab.is-active { background: var(--blossom); color: var(--primary-deep); font-weight: 700; }
.admin-panel { display: grid; flex: 1; align-content: start; gap: 14px; min-height: 0; padding: 18px 20px 24px; overflow-y: auto; }
.edit-sections, .edit-object, .edit-array { display: grid; gap: 12px; min-width: 0; }
.edit-group { min-width: 0; margin: 0; padding: 14px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); }
.edit-group legend { padding: 0 8px; color: var(--primary-deep); font-weight: 700; }
.edit-item { display: grid; gap: 8px; padding: 12px; border-radius: 12px; background: color-mix(in srgb, var(--blossom) 12%, var(--surface)); }
.edit-item-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.edit-item-head .detail-title { margin: 0; }
.field input[type="color"] { width: 64px; padding: 4px; }
.mini-btn { justify-self: start; min-height: 44px; padding: 0 12px; border: 1px solid var(--blossom); border-radius: 999px; background: var(--surface); color: var(--primary-deep); font: inherit; font-size: 0.85rem; cursor: pointer; }
.admin-savebar { position: sticky; bottom: -24px; padding: 12px 0; background: var(--bg); }
.roster-list { display: grid; gap: 6px; }
.roster-list li { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 12px; border-radius: 12px; background: var(--surface); overflow-wrap: anywhere; }
.table-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.data-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
.data-table th, .data-table td { padding: 8px 12px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
.data-table th { background: color-mix(in srgb, var(--lilac) 30%, var(--surface)); }
.data-table tr:last-child td { border-bottom: 0; }

/* 참여 기능 공통 */
.demo-notice {
  margin-bottom: 16px;
  padding: 10px 16px;
  border-radius: 14px;
  background: color-mix(in srgb, var(--lilac) 45%, var(--surface));
  color: var(--primary-deep);
  font-size: 0.92rem;
}
.field { display: grid; gap: 6px; min-width: 0; }
.field.is-full { grid-column: 1 / -1; }
.field-label { font-weight: 700; font-size: 0.95rem; }
.field input:not([type="checkbox"]), .field select, .field textarea {
  width: 100%;
  min-height: 48px;
  padding: 10px 14px;
  border: 1px solid #cfc4b0;
  border-radius: 14px;
  background: var(--surface);
  color: var(--text);
  font: inherit;
}
.field textarea { resize: vertical; }
.field input[type="file"] { padding: 10px; }
[aria-invalid="true"] { border-color: #b3261e !important; }
.field-error { color: #b3261e; font-size: 0.9rem; }
.check-field { display: flex; align-items: flex-start; gap: 10px; min-height: 44px; padding-block: 8px; cursor: pointer; }
.check-field input { flex: none; width: 20px; height: 20px; margin: 3px 0 0; accent-color: var(--primary); }
.form-summary { margin-bottom: 14px; padding: 12px 16px; border: 1px solid #e7b5b0; border-radius: 14px; background: #fdf0ef; color: #8c1d18; }
.form-summary-title { font-weight: 700; }
.form-summary ul { list-style: disc; padding-left: 20px; }
.form-ok { color: #1f6b43; font-weight: 700; }
.form-success { display: grid; gap: 14px; justify-items: start; padding-block: 12px; }

/* 투표 */
.poll-list { display: grid; gap: 6px; }
.poll-option {
  display: block;
  width: 100%;
  padding: 12px 14px;
  border: 1px solid transparent;
  border-radius: 14px;
  background: transparent;
  color: var(--text);
  font: inherit;
  text-align: left;
  cursor: pointer;
  transition: background-color 0.2s;
}
.poll-option:hover { background: color-mix(in srgb, var(--blossom) 22%, transparent); }
.poll-option.is-mine { border-color: var(--blossom); }
.poll-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 12px; }
.poll-label { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 8px; font-weight: 700; }
.poll-mine { padding: 0 10px; border-radius: 999px; background: var(--primary); color: #fff; font-size: 0.78rem; }
.poll-value { color: var(--muted); font-variant-numeric: tabular-nums; }
.poll-bar { display: block; height: 12px; margin-top: 8px; border-radius: 4px; background: color-mix(in srgb, var(--blossom) 28%, transparent); overflow: hidden; }
.poll-fill { display: block; height: 100%; border-radius: 4px; background: var(--primary); transition: width 0.45s var(--ease); }
.poll-total { margin-top: 12px; padding-inline: 14px; color: var(--muted); font-size: 0.92rem; }

/* 회원가입 */
.apply-form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 20px; }
.apply-form > .field:last-child { justify-items: start; }
.apply-form .form-summary { width: 100%; }

/* 수강생 공간 */
.login-card { display: grid; gap: 14px; max-width: 440px; }
.login-card .btn { width: 100%; font-family: inherit; cursor: pointer; }
.portal-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 16px; }
.portal-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; align-items: start; }
.portal-card { display: grid; gap: 12px; min-width: 0; }
.portal-count { margin: 6px 0 0; }
.attend-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 6px; }
.attend-chip { display: grid; padding: 6px 8px; border-radius: 12px; background: color-mix(in srgb, var(--line) 55%, var(--surface)); font-size: 0.85rem; text-align: center; }
.attend-chip.is-done { background: color-mix(in srgb, var(--blossom) 60%, var(--surface)); font-weight: 700; }
.attend-mark { color: var(--muted); font-size: 0.78rem; }
.attend-chip.is-done .attend-mark { color: var(--primary-deep); }
.submit-form { display: grid; gap: 12px; }
.history-list { display: grid; gap: 6px; }
.history-list li { display: grid; padding: 8px 12px; border-radius: 12px; background: color-mix(in srgb, var(--blossom) 18%, var(--surface)); }
.history-name { font-weight: 700; overflow-wrap: anywhere; }

/* 실시간 퀴즈 */
.quiz-block { margin-top: clamp(36px, 5vw, 56px); padding-top: clamp(28px, 4vw, 40px); border-top: 1px solid var(--blossom); scroll-margin-top: calc(var(--header-h) + 16px); }
.quiz-stage { display: grid; gap: 20px; margin-top: 18px; }
.quiz-join { display: grid; gap: 14px; max-width: 440px; }
.quiz-join .btn, .quiz-play .btn, .quiz-lobby .btn, .quiz-setup .btn { font-family: inherit; cursor: pointer; }
.quiz-setup { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; align-items: start; }
.quiz-ai-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.quiz-editor { display: grid; gap: 10px; }
.quiz-edit-choices { display: grid; gap: 6px; }
.quiz-edit-choice { display: grid; grid-template-columns: 22px 18px minmax(0, 1fr); align-items: center; gap: 6px; }
.quiz-edit-choice input[type="radio"] { width: 20px; height: 20px; margin: 0; accent-color: var(--primary); }
.quiz-edit-choice input[type="text"], .quiz-edit-limit input, .quiz-editor textarea {
  width: 100%;
  min-height: 44px;
  padding: 8px 12px;
  border: 1px solid #cfc4b0;
  border-radius: 12px;
  background: var(--surface);
  color: var(--text);
  font: inherit;
}
.quiz-edit-limit { display: flex; align-items: center; gap: 10px; font-size: 0.9rem; }
.quiz-edit-limit input { width: 90px; }
.quiz-lobby { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: clamp(20px, 4vw, 40px); }
.quiz-join-info { display: grid; justify-items: center; gap: 4px; text-align: center; }
.quiz-join-info .demo-notice { max-width: 260px; margin: 8px 0 0; }
.quiz-qr { padding: 12px; border-radius: 16px; background: #fff; }
.quiz-qr img, .quiz-qr canvas { display: block; }
.quiz-code-label { margin-top: 8px; color: var(--muted); font-size: 0.9rem; }
.quiz-code { color: var(--primary-deep); font-size: clamp(2rem, 5vw, 3rem); font-weight: 700; letter-spacing: 0.12em; line-height: 1.2; font-variant-numeric: tabular-nums; }
.quiz-lobby-side { display: grid; align-content: start; gap: 12px; min-width: 0; }
.quiz-players { display: flex; flex-wrap: wrap; gap: 6px; min-height: 40px; }
.quiz-players li { padding: 4px 14px; border-radius: 999px; background: var(--blossom); color: var(--primary-deep); font-weight: 700; overflow-wrap: anywhere; }
.quiz-play { display: grid; gap: 16px; min-width: 0; }
.quiz-center { justify-items: center; text-align: center; }
.quiz-play-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.quiz-play-head .detail-title { margin: 0; }
.quiz-timer {
  display: grid;
  place-items: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--violet);
  color: #fff;
  font-size: 1.4rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.quiz-question { font-family: var(--font-display), var(--font-hanzi); font-size: clamp(1.3rem, 3vw, 1.9rem); font-weight: 700; line-height: 1.4; }
.quiz-choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.quiz-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 84px;
  padding: 14px 16px;
  border: 0;
  border-radius: 16px;
  color: #fff;
  font: inherit;
  font-size: 1.05rem;
  font-weight: 700;
  text-align: left;
  overflow-wrap: anywhere;
}
button.quiz-choice { cursor: pointer; transition: transform 0.15s var(--ease); }
button.quiz-choice:hover { transform: translateY(-2px); }
.quiz-choice.c0 { background: #14534f; }
.quiz-choice.c1 { background: #96590c; }
.quiz-choice.c2 { background: #46586a; }
.quiz-choice.c3 { background: #9a3b2e; }
.quiz-shape { flex: none; font-size: 1.4rem; }
.quiz-result-list { display: grid; gap: 10px; }
.quiz-result-list li { padding: 10px 12px; border-radius: 12px; }
.quiz-result-list .is-correct { background: color-mix(in srgb, var(--blossom) 25%, var(--surface)); }
.quiz-board { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.quiz-board li { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 12px; background: color-mix(in srgb, var(--lilac) 22%, var(--surface)); }
.quiz-rank { font-weight: 700; color: var(--violet); font-variant-numeric: tabular-nums; }
.quiz-verdict { font-family: var(--font-display); font-size: clamp(2rem, 7vw, 3rem); font-weight: 700; line-height: 1.2; }
.quiz-verdict.is-right { color: #1f6b43; }
.quiz-verdict.is-wrong { color: #b3261e; }

/* 팝업·폭죽 */
.popup {
  width: min(420px, calc(100vw - 32px));
  padding: 28px;
  border: 0;
  border-radius: var(--radius-lg);
  background: var(--surface);
  color: var(--text);
  box-shadow: var(--shadow);
}
.popup::backdrop { background: rgba(13, 61, 58, 0.45); }
.popup-glyph {
  display: grid;
  place-items: center;
  width: 56px;
  height: 56px;
  margin-bottom: 12px;
  border-radius: 50%;
  background: var(--blossom);
  color: var(--primary-deep);
  font-family: var(--font-hanzi);
  font-size: 1.6rem;
  font-weight: 700;
}
.popup-text { max-height: 45vh; overflow-y: auto; white-space: pre-line; overflow-wrap: anywhere; }
.popup-hide { margin-top: 10px; font-size: 0.95rem; }
.popup-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
.popup-actions .btn { flex: 1 1 auto; font-family: inherit; cursor: pointer; }
.confetti { position: fixed; inset: 0; z-index: 90; width: 100%; height: 100%; pointer-events: none; }

@media (max-width: 1120px) {
  .menu-toggle { display: block; }
  .site-nav {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    padding: 8px 16px 16px;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    box-shadow: 0 14px 24px color-mix(in srgb, var(--primary) 10%, transparent);
    display: none;
  }
  .site-nav.is-open { display: block; }
  .nav-list { flex-direction: column; }
  .nav-link { min-height: 48px; }
}

@media (max-width: 760px) {
  .hero-grid, .guide-grid { grid-template-columns: minmax(0, 1fr); }
  .hero-card { transform: none; margin-top: 16px; }
  .hero-actions .btn { flex: 1 1 140px; }
  .calendar-layout, .portal-grid, .apply-form, .quiz-setup, .quiz-lobby { grid-template-columns: minmax(0, 1fr); }
  .week-summary { grid-template-columns: minmax(0, 1fr) auto; padding-inline: 16px; }
  .week-num { grid-column: 1; }
  .week-marks { grid-column: 2; grid-row: 1 / span 2; }
  .week-heading { grid-column: 1; }
  .week-body { padding-inline: 16px; }
  .week-meta { grid-template-columns: minmax(0, 1fr); }
  .facts, .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .slider-track { grid-auto-columns: 85%; column-gap: 14px; }
  .prepare-grid { grid-template-columns: minmax(0, 1fr); }
  .footer-profile { grid-template-columns: auto minmax(0, 1fr); }
  .footer-contact { grid-column: 1 / -1; }
}

@media (max-width: 520px) {
  .facts, .quiz-choices { grid-template-columns: minmax(0, 1fr); }
  .quiz-choice { min-height: 68px; }
  .quiz-lobby .quiz-qr { justify-self: center; }
  .footer-profile { grid-template-columns: minmax(0, 1fr); }
  .site-footer { padding-bottom: 84px; }
  .header-login-name, .brand-org { display: none; }

<script id="site-app">
(function () {
  "use strict";

  var C = window.SITE_CONFIG;
  var root = document.getElementById("app");

  if (!C) {
    root.textContent = "사이트 설정을 불러오지 못했습니다. index.html의 설정 블록을 확인해 주세요.";
    return;
  }

  // 관리자 화면에서 저장한 설정이 있으면 파일의 기본 설정 위에 덮어쓴다.
  try {
    var savedConfig = JSON.parse(localStorage.getItem("kc.config"));
    if (savedConfig) {
      var fileVersion = C.version;
      Object.keys(savedConfig).forEach(function (key) { C[key] = savedConfig[key]; });
      // 파일이 더 새 버전이면 예전에 저장한 번호로 되돌아가지 않게 한다.
      if (compareVersions(fileVersion, C.version) > 0) C.version = fileVersion;
    }
  } catch (e) {
    // 저장소를 쓸 수 없으면 파일의 기본 설정으로 연다.
  }

  // 요소 생성 도우미: 설정값은 항상 textContent로 넣어 HTML로 해석되지 않게 한다.
  function h(tag, attrs, children) {
    var el = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (key) {
      if (key === "class") el.className = attrs[key];
      else if (key === "text") el.textContent = attrs[key];
      // 설정 파일에 스크립트 주소가 들어와도 실행되지 않게 막는다.
      else if ((key === "href" || key === "src") && /^\s*(javascript|data):/i.test(attrs[key])) el.setAttribute(key, "#");
      else el.setAttribute(key, attrs[key]);
    });
    (children || []).forEach(function (child) {
      if (child) el.appendChild(child);
    });
    return el;
  }

  function applyTheme(theme) {
    var map = {
      primary: "--primary", primaryDeep: "--primary-deep", violet: "--violet",
      blossom: "--blossom", lilac: "--lilac", background: "--bg",
      surface: "--surface", text: "--text", muted: "--muted", line: "--line"
    };
    Object.keys(map).forEach(function (key) {
      if (theme[key]) document.documentElement.style.setProperty(map[key], theme[key]);
    });
  }

  function sectionHead(s) {
    return h("div", { class: "section-head reveal" }, [
      h("p", { class: "section-label", text: s.label }),
      h("h2", { class: "section-title", text: s.title }),
      s.intro || s.note ? h("p", { class: "section-sub", text: s.intro || s.note }) : null
    ]);
  }

  function section(id, alt, head, body) {
    return h("section", { id: id, class: "section" + (alt ? " section-alt" : "") }, [
      h("div", { class: "wrap" }, [head, body])
    ]);
  }

  function infoList(items) {
    return h("dl", { class: "info-list" }, items.map(function (item) {
      return h("div", { class: "info-row" }, [
        h("dt", { text: item.label }),
        h("dd", { text: item.value })
      ]);
    }));
  }

  // 사이트 로고: 中 글자를 데이터 연결점으로 그린 표시입니다.
  var BRAND_LOGO_SVG = "<svg viewBox='0 0 48 48' width='100%' height='100%' aria-hidden='true'><rect x='12' y='16' width='24' height='15' rx='2.5' fill='none' stroke='#fff' stroke-width='3.2'/><path d='M24 10v28' stroke='#fff' stroke-width='3.2' stroke-linecap='round'/><circle cx='24' cy='8' r='3.4' fill='#e8b95a'/><circle cx='24' cy='40' r='3.4' fill='#e8b95a'/></svg>";
  function brandLogo(className) {
    var mark = h("span", { class: className, "aria-hidden": "true" });
    mark.innerHTML = BRAND_LOGO_SVG;
    return mark;
  }

  function renderHeader() {
    var navList = h("ul", { class: "nav-list" }, C.nav.map(function (item) {
      return h("li", {}, [
        h("a", { class: "nav-link", href: "#" + item.id, "data-nav": item.id, text: item.label })
      ]);
    }));
    var nav = h("nav", { class: "site-nav", id: "site-nav", "aria-label": "주요 메뉴" }, [navList]);
    var toggle = h("button", {
      class: "menu-toggle", type: "button", "aria-controls": "site-nav",
      "aria-expanded": "false", "aria-label": C.ui.menuOpen
    }, [h("span", {})]);

    function setMenu(open) {
      nav.classList.toggle("is-open", open);
      toggle.setAttribute("aria-expanded", String(open));
      toggle.setAttribute("aria-label", open ? C.ui.menuClose : C.ui.menuOpen);
    }
    toggle.addEventListener("click", function () {
      setMenu(!nav.classList.contains("is-open"));
    });
    nav.addEventListener("click", function (e) {
      if (e.target.closest("a")) setMenu(false);
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") setMenu(false);
    });
    document.addEventListener("click", function (e) {
      if (!header.contains(e.target)) setMenu(false);
    });

    var header = h("header", { class: "site-header" }, [
      h("div", { class: "wrap header-row" }, [
        h("a", { class: "brand", href: "#top" }, [
          brandLogo("brand-glyph"),
          h("span", { class: "brand-text" }, [
            h("span", { class: "brand-org", text: C.brand.org }),
            h("span", { class: "brand-name" }, [
              document.createTextNode(C.brand.name),
              C.version ? h("span", { class: "site-version", text: "v" + C.version }) : null
            ])
          ])
        ]),
        nav,
        h("div", { class: "header-actions" }, [renderHeaderLogin(), renderLockButton(), toggle])
      ])
    ]);
    return header;
  }

  function statValue(item) {
    if (item.valueFrom === "tools") return C.tools.items.length;
    if (item.valueFrom === "weeks") return C.curriculum.weeks.length;
    return item.value;
  }

  function renderStats() {
    return h("section", { class: "stats", "aria-label": "강의 주요 숫자" }, [
      h("ul", { class: "wrap stats-grid" }, C.stats.items.map(function (item) {
        var value = statValue(item);
        var hasValue = typeof value === "number";
        var num = h("span", { class: "stat-num" + (hasValue ? "" : " is-empty"), text: hasValue ? String(value) : C.stats.emptyText });
        if (hasValue) num.setAttribute("data-count", value);
        return h("li", { class: "stat-card reveal" }, [
          h("p", { class: "stat-value" }, [
            num,
            hasValue ? h("span", { class: "stat-suffix", text: item.suffix }) : null
          ]),
          h("p", { class: "stat-label", text: item.label })
        ]);
      }))
    ]);
  }

  function renderSlider() {
    var d = C.about;
    var track = h("ul", { class: "slider-track", tabindex: "0", "aria-label": d.title }, d.slides.map(function (s) {
      return h("li", { class: "card slide" }, [
        h("div", { class: "glyph-badge", lang: "zh-Hant", "aria-hidden": "true", text: s.glyph }),
        h("h3", { class: "card-title", text: s.title }),
        h("p", { class: "card-text", text: s.text })
      ]);
    }));
    var prev = h("button", { class: "slider-btn", type: "button", "aria-label": d.prevLabel, text: "←" });
    var next = h("button", { class: "slider-btn", type: "button", "aria-label": d.nextLabel, text: "→" });
    var status = h("span", { class: "slider-status", "aria-live": "polite" });

    function step() {
      var slide = track.children[0];
      return slide.getBoundingClientRect().width + parseFloat(getComputedStyle(track).columnGap || 0);
    }
    function move(dir) {
      track.scrollBy({ left: dir * step() });
    }
    function update() {
      var max = track.scrollWidth - track.clientWidth;
      // 한 화면에 여러 장이 보이므로 넘길 수 있는 위치 수를 기준으로 표시한다.
      var positions = Math.round(max / step()) + 1;
      var index = Math.round(track.scrollLeft / step());
      prev.disabled = track.scrollLeft <= 2;
      next.disabled = track.scrollLeft >= max - 2;
      status.textContent = Math.min(index + 1, positions) + " / " + positions;
    }
    prev.addEventListener("click", function () { move(-1); });
    next.addEventListener("click", function () { move(1); });
    track.addEventListener("scroll", update, { passive: true });
    window.addEventListener("resize", update);
    requestAnimationFrame(update);

    return h("div", { class: "slider reveal" }, [
      track,
      h("div", { class: "slider-controls" }, [prev, status, next])
    ]);
  }

  function renderPoll() {
    var d = C.poll;
    var list = h("ul", { class: "poll-list" });
    var total = h("p", { class: "poll-total", "aria-live": "polite" });

    function draw() {
      var votes = store.get("votes", {});
      var mine = store.get("myVote", null);
      var sum = d.options.reduce(function (acc, o) { return acc + (votes[o.id] || 0); }, 0);
      total.textContent = d.totalLabel + sum + d.voteUnit;
      list.textContent = "";
      d.options.forEach(function (o) {
        var count = votes[o.id] || 0;
        var percent = sum ? Math.round(count / sum * 100) : 0;
        var fill = h("span", { class: "poll-fill" });
        fill.style.width = percent + "%";
        var btn = h("button", {
          class: "poll-option" + (mine === o.id ? " is-mine" : ""),
          type: "button",
          "aria-pressed": String(mine === o.id),
          title: o.label + ": " + count + d.voteUnit + " (" + percent + "%)"
        }, [
          h("span", { class: "poll-head" }, [
            h("span", { class: "poll-label" }, [
              document.createTextNode(o.label),
              mine === o.id ? h("span", { class: "poll-mine", text: d.mine }) : null
            ]),
            h("span", { class: "poll-value", text: count + d.voteUnit + " · " + percent + "%" })
          ]),
          h("span", { class: "poll-bar", "aria-hidden": "true" }, [fill])
        ]);
        btn.addEventListener("click", function () { vote(o.id); });
        list.appendChild(h("li", {}, [btn]));
      });
    }

    function vote(id) {
      var votes = store.get("votes", {});
      var mine = store.get("myVote", null);
      if (mine === id) return;
      if (mine && votes[mine]) votes[mine] -= 1;
      votes[id] = (votes[id] || 0) + 1;
      store.set("votes", votes);
      store.set("myVote", id);
      draw();
    }

    // 같은 브라우저의 다른 탭에서 투표하면 바로 다시 그린다.
    window.addEventListener("storage", function (e) {
      if (e.key === "kc.votes" || e.key === "kc.myVote") draw();
    });

    return section("poll", true, sectionHead(d), h("div", {}, [
      demoNotice(),

  function renderField(f) {
    var id = "apply-" + f.name;
    var error = h("p", { class: "field-error", id: id + "-error", hidden: "hidden" });
    var attrs = { id: id, name: f.name, "aria-describedby": id + "-error" };
    if (f.required) attrs["aria-required"] = "true";
    if (f.autocomplete) attrs.autocomplete = f.autocomplete;
    if (f.inputmode) attrs.inputmode = f.inputmode;
    var control;
    if (f.type === "select") {
      control = h("select", attrs, [h("option", { value: "", text: f.placeholder })].concat(f.options.map(function (o) {
        return h("option", { value: o, text: o });
      })));
    } else if (f.type === "textarea") {
      attrs.rows = f.rows;
      control = h("textarea", attrs);
    } else {
      attrs.type = f.type;
      control = h("input", attrs);
    }
    var mark = f.required ? " *" : "";
    var body = f.type === "checkbox"
      ? [h("label", { class: "check-field", for: id }, [control, h("span", { text: f.label + mark })]), error]
      : [h("label", { class: "field-label", for: id, text: f.label + mark + (f.hint || "") }), control, error];
    return h("div", { class: "field" + (f.full ? " is-full" : "") }, body);
  }

  function fieldError(f, control) {
    var d = C.apply;
    if (f.type === "checkbox") return control.checked ? "" : f.requiredMessage;
    var value = control.value.trim();
    if (!value) return f.label + (f.type === "select" ? d.requiredSelect : d.required);
    if (f.pattern && !new RegExp(f.pattern).test(value)) return f.patternMessage;
    return "";
  }

  function renderApply() {
    var d = C.apply;
    var summary = h("div", { class: "form-summary", role: "alert", hidden: "hidden" });
    var form = h("form", { class: "apply-form", novalidate: "novalidate" }, d.fields.map(renderField).concat([
      h("div", { class: "field is-full" }, [
        summary,
        h("button", { class: "btn btn-primary", type: "submit", text: d.submit })
      ])
    ]));
    var card = h("div", { class: "card reveal" }, [form]);

    function setError(f, message) {
      var control = form.elements[f.name];
      var error = document.getElementById("apply-" + f.name + "-error");
      error.textContent = message;
      error.hidden = !message;
      if (message) control.setAttribute("aria-invalid", "true");
      else control.removeAttribute("aria-invalid");
    }

    function validate() {
      var problems = [];
      d.fields.forEach(function (f) {
        var message = f.required ? fieldError(f, form.elements[f.name]) : "";
        setError(f, message);
        if (message) problems.push({ field: f, message: message });
      });
      return problems;
    }

    function showSummary(problems) {
      summary.textContent = "";
      summary.hidden = !problems.length;
      if (!problems.length) return;
      summary.appendChild(h("p", { class: "form-summary-title", text: d.summary }));
      summary.appendChild(h("ul", {}, problems.map(function (p) {
        return h("li", { text: p.message });
      })));
    }

    d.fields.forEach(function (f) {
      form.elements[f.name].addEventListener("change", function () {
        if (form.elements[f.name].hasAttribute("aria-invalid")) setError(f, fieldError(f, form.elements[f.name]));
      });
    });

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var problems = validate();
      var studentId = form.elements.studentId.value.trim();
      var applications = store.get("applications", []);
      if (!problems.length && applications.some(function (a) { return a.studentId === studentId; })) {
        var idField = d.fields.filter(function (f) { return f.name === "studentId"; })[0];
        setError(idField, d.duplicate);
        problems.push({ field: idField, message: d.duplicate });
      }
      var memberId = form.elements.memberId.value.trim().toLowerCase();
      if (!problems.length && applications.some(function (a) { return String(a.memberId || "").toLowerCase() === memberId; })) {
        var memberField = d.fields.filter(function (f) { return f.name === "memberId"; })[0];
        setError(memberField, d.duplicateId);
        problems.push({ field: memberField, message: d.duplicateId });
      }
      showSummary(problems);
      if (problems.length) {
        form.elements[problems[0].field.name].focus();
        return;
      }
      var record = { submittedAt: new Date().toISOString() };
      d.fields.forEach(function (f) {
        var control = form.elements[f.name];
        if (f.secret) return;
        record[f.name] = f.type === "checkbox" ? control.checked : control.value.trim();
      });
      var submitBtn = form.querySelector('button[type="submit"]');
      var salt = bytesToHex(crypto.getRandomValues(new Uint8Array(16)));
      submitBtn.disabled = true;
      Promise.resolve().then(function () {
        return derivePassword(form.elements.password.value, salt, C.admin.iterations);
      }).then(function (hash) {
        record.passwordSalt = salt;
        record.passwordIterations = C.admin.iterations;
        record.passwordHash = hash;
        applications.push(record);
        store.set("applications", applications);
        form.reset();

        var again = h("button", { class: "btn btn-ghost", type: "button", text: d.another });
        var done = h("div", { class: "form-success", role: "status", tabindex: "-1" }, [
          h("p", { class: "card-title", text: record.name + d.success }),
          again
        ]);
        again.addEventListener("click", function () {
          card.replaceChild(form, done);
          form.elements[d.fields[0].name].focus();
        });
        card.replaceChild(done, form);
        done.focus();
      }).catch(function () {
        showSummary([{ message: d.hashFailed }]);
      }).then(function () {
        submitBtn.disabled = false;
      });
    });

    return section("apply", false, sectionHead(d), h("div", {}, [demoNotice(), card]));
  }

  function formatSize(bytes) {
    return bytes < 1048576 ? Math.max(1, Math.round(bytes / 1024)) + "KB" : (bytes / 1048576).toFixed(1) + "MB";
  }

  function formatStamp(iso) {
    var d = new Date(iso);
    var pad = function (n) { return (n < 10 ? "0" : "") + n; };
    return (d.getMonth() + 1) + "월 " + d.getDate() + "일 " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }

  function renderLogin(d, onLogin) {
    var message = h("p", { class: "field-error", role: "alert", hidden: "hidden" });
    var id = h("input", { id: "login-id", type: "text", autocomplete: "username" });
    var pw = h("input", { id: "login-pw", type: "password", autocomplete: "current-password" });
    var submit = h("button", { class: "btn btn-primary", type: "submit", text: d.login });
    var form = h("form", { class: "login-card", novalidate: "novalidate" }, [
      h("h3", { class: "card-title", text: d.loginTitle }),
      h("div", { class: "field" }, [h("label", { class: "field-label", for: "login-id", text: d.idLabel }), id]),
      h("div", { class: "field" }, [h("label", { class: "field-label", for: "login-pw", text: d.pwLabel }), pw]),
      message,
      submit,
      h("p", { class: "submit-note", text: d.loginHint })
    ]);
    function fail(error) {
      message.textContent = error;
      message.hidden = false;
      pw.value = "";
    }
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var idValue = id.value.trim().toLowerCase();
      if (!idValue || !pw.value) return fail(d.loginEmpty);
      var member = store.get("applications", []).filter(function (a) {
        return String(a.memberId || "").toLowerCase() === idValue && a.passwordHash;
      })[0];
      if (!member) return fail(d.loginFailed);
      submit.disabled = true;
      Promise.resolve().then(function () {
        return derivePassword(pw.value, member.passwordSalt, member.passwordIterations);
      }).then(function (hash) {
        if (hash !== member.passwordHash) return fail(d.loginFailed);
        message.hidden = true;
        pw.value = "";
        // 출석·과제 기록은 지금처럼 학번을 기준으로 저장한다.
        store.set("session", { id: member.studentId, name: member.name, memberId: member.memberId });
        onLogin();
      }).catch(function () {
        fail(d.loginUnavailable);
      }).then(function () {
        submit.disabled = false;
      });
    });
    return form;
  }

  function renderAttendance(d, student, sched, redraw, flash) {
    var key = "attendance." + student.id;
    var record = store.get(key, {});
    var today = todayString();
    var todayClass = sched.byDate[today];
    var target = todayClass;
    var note = "";
    if (!todayClass && C.backend.allowAnyDay) {
      target = sched.weeks.filter(function (x) { return !record[x.week.week]; })[0];
      note = target ? d.attendDemoNote : d.attendDone;
    } else if (!todayClass) {
      note = d.attendNone;
    } else if (record[todayClass.week.week]) {
      note = d.attendedToday;
      target = null;
    }
    var button = null;
    if (target) {
      button = h("button", { class: "btn btn-primary btn-small", type: "button", text: target.week.week + d.attendButton });
      button.addEventListener("click", function () {
        var latest = store.get(key, {});
        latest[target.week.week] = new Date().toISOString();
        store.set(key, latest);
        redraw(target.week.week + d.attendSaved);
      });

    return h("article", { class: "card portal-card" }, [
      h("h3", { class: "card-title", text: d.attendanceTitle }),

  function renderSubmission(d, student, sched, redraw, flash) {
    var key = "submissions." + student.id;
    var tasks = sched.weeks.filter(function (x) { return x.week.assignment; });
    var history = store.get(key, {});
    var select = h("select", { id: "submit-assignment" }, tasks.map(function (x) {
      return h("option", { value: String(x.week.week), text: x.week.week + C.ui.weekSuffix + " · " + x.week.assignment.title });
    }));
    if (pendingSubmitWeek) select.value = String(pendingSubmitWeek);
    pendingSubmitWeek = null;
    var file = h("input", { id: "submit-file", type: "file", accept: d.allowedExtensions.map(function (x) { return "." + x; }).join(",") });
    var status = h("p", { class: "submit-note" });
    var error = h("p", { class: "field-error", role: "alert", hidden: "hidden" });
    var button = h("button", { class: "btn btn-primary btn-small", type: "submit", text: d.submit });

    function currentTask() {
      return tasks.filter(function (x) { return String(x.week.week) === select.value; })[0];
    }
    function updateStatus() {
      var task = currentTask();
      var closed = task.dueAt <= Date.now();
      var blocked = closed && !C.backend.ignoreDeadlines;
      var parts = [C.curriculum.labels.due + ": " + formatDate(task.dueDate) + " " + task.dueTime];
      if (closed) parts.push(blocked ? d.closed : d.lateDemo);
      if (history[task.week.week]) parts.push(d.resubmit);
      status.textContent = parts.join(" ");
      button.disabled = blocked;
    }
    select.addEventListener("change", updateStatus);
    updateStatus();

    var form = h("form", { class: "submit-form", novalidate: "novalidate" }, [
      h("div", { class: "field" }, [h("label", { class: "field-label", for: "submit-assignment", text: d.assignmentLabel }), select]),
      status,
      h("div", { class: "field" }, [
        h("label", { class: "field-label", for: "submit-file", text: d.fileLabel }),
        file,
        h("p", { class: "submit-note", text: d.fileHint })
      ]),
      error,
      flash ? h("p", { class: "form-ok", role: "status", text: flash }) : null,
      h("div", {}, [button])
    ]);
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var picked = file.files[0];
      var message = "";
      if (!picked) message = d.fileMissing;
      else if (d.allowedExtensions.indexOf(picked.name.split(".").pop().toLowerCase()) < 0) message = d.fileType;
      else if (picked.size > d.maxFileMb * 1048576) message = d.fileSize;
      else if (currentTask().dueAt <= Date.now() && !C.backend.ignoreDeadlines) message = d.closed;
      error.textContent = message;
      error.hidden = !message;
      if (message) return;
      var latest = store.get(key, {});
      latest[select.value] = { fileName: picked.name, size: picked.size, submittedAt: new Date().toISOString() };
      store.set(key, latest);
      redraw(null, d.saved);
    });

    var rows = tasks.filter(function (x) { return history[x.week.week]; });
    return h("article", { class: "card portal-card" }, [
      h("h3", { class: "card-title", text: d.submitTitle }),
      form,
      h("p", { class: "detail-title portal-count", text: d.historyTitle }),
      rows.length ? h("ul", { class: "history-list" }, rows.map(function (x) {
        var r = history[x.week.week];
        return h("li", {}, [
          h("span", { class: "history-name", text: x.week.week + C.ui.weekSuffix + " · " + r.fileName }),
          h("span", { class: "submit-note", text: formatSize(r.size) + " · " + formatStamp(r.submittedAt) })
        ]);
      })) : h("p", { class: "card-text", text: d.historyEmpty })
    ]);
  }

  })();
  var QUIZ_PREFIX = "kc-quiz-";

  var QUIZ_LIBS = {
    peer: { url: "https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js", integrity: "sha384-nlUQ8ZqCbvStErob+biJNzSgltf6urV3VGqhfIfzhmg9RXmpeRm76ELw0pYnKlTR" },

    jszip: { url: "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js", integrity: "sha384-+mbV2IY1Zk/X1p/nWllGySJSUN8uMs+gUAN10Or95UBH0fpj6GfKgPmgC5EXieXG" },
    xlsx: { url: "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js", integrity: "sha384-vtjasyidUo0kW94K5MXDXntzOJpQgBKXmE7e2Ga4LG0skTTLeBi97eFAXsqewJjw" },

  };
  var libPromises = {};
  var quizStage = null;
  var quizHost = null;
  var quizPlayer = null;
  var refreshQuiz = function () {};

  function loadLib(name) {
    if (libPromises[name]) return libPromises[name];
    libPromises[name] = new Promise(function (resolve, reject) {
      var lib = QUIZ_LIBS[name];
      var s = h("script", { src: lib.url, integrity: lib.integrity, crossorigin: "anonymous" });
      s.onload = resolve;
      s.onerror = function () {
        delete libPromises[name];
        reject(new Error("load"));
      };
      document.body.appendChild(s);
    });
    return libPromises[name];
  }

  function normalizeQuestions(parsed) {
    var list = Array.isArray(parsed) ? parsed : parsed && parsed.questions;
    if (!Array.isArray(list)) return [];
    return list.filter(function (q) {
      return q && typeof q.text === "string" && q.text.trim() && Array.isArray(q.choices) && q.choices.length === 4
        && q.choices.every(function (c) { return typeof c === "string" && c.trim(); })
        && Number.isInteger(q.answer) && q.answer >= 0 && q.answer < 4;
    }).map(function (q) {
      var limit = Number(q.limit);
      return {
        text: q.text.trim(),
        choices: q.choices.map(function (c) { return c.trim(); }),
        answer: q.answer,
        limit: limit >= 5 && limit <= 120 ? limit : C.quiz.defaultLimit
      };
    });
  }

  function quizPrompt(topic, count, level) {
    return "대학 입문 교양중국어 수업의 실시간 퀴즈 문제를 출제해 주세요.\n"
      + "주제: " + topic + "\n문항 수: " + count + "\n난이도: " + level + "\n"
      + "조건: 문제와 해설용 문구는 한국어로 쓰고, 중국어는 간체자로 쓰며 필요하면 병음을 함께 적습니다. "
      + "각 문제는 보기 4개 중 정답이 하나인 객관식입니다. 휴대폰에서 읽기 좋게 문제는 60자, 보기는 25자 이내로 씁니다. "
      + "정답 위치를 고르게 섞고, 중국어 표기와 정답이 정확한지 확인한 뒤 답합니다.\n"
      + "answer는 정답 보기의 번호이며 0부터 시작합니다.";
  }

  // AI 호출 공용 경로입니다. 키는 관리자 화면에서 등록하며 이 브라우저에만 저장됩니다(설정 파일·배포 파일에 들어가지 않음).
  // BAZE 게이트웨이는 Anthropic Messages API 형식을 그대로 받습니다.
  var AI_PROVIDERS = [
    {
      id: "anthropic",
      name: "Anthropic",
      url: "https://api.anthropic.com/v1/messages",
      headers: { "anthropic-beta": "server-side-fallback-2026-07-01", "anthropic-dangerous-direct-browser-access": "true" },
      body: { fallbacks: "default" }
    },
    {
      id: "baze",
      name: "BAZE",
      url: "https://api.baze.co/v1/gateway/claude/v1/messages/",
      headers: {},
      body: {}
    }
  ];

  function aiProviders() {
    var saved = store.get("aiKeys", {}) || {};
    return AI_PROVIDERS.filter(function (p) { return saved[p.id]; });
  }

  function aiCallOnce(provider, body, parse) {
    function finalError(message) {
      var e = new Error(message);
      e.isFinal = true;
      return e;
    }
    return fetch(provider.url, {
      method: "POST",
      headers: Object.assign({
        "content-type": "application/json",
        "x-api-key": store.get("aiKeys", {})[provider.id],
        "anthropic-version": "2026-10-21"
      }, provider.headers),
      body: JSON.stringify(Object.assign({}, body, provider.body))
    }).catch(function () {
      throw new Error("AI 서버에 연결하지 못했습니다.");
    }).then(function (res) {
      if (res.status === 401) throw new Error("API 키가 올바르지 않습니다.");
      if (res.status === 402) throw new Error("크레딧이 부족합니다.");
      if (res.status === 403) throw new Error("이 키로는 모델(" + body.model + ")을 쓸 권한이 없습니다.");
      if (res.status === 404) throw new Error("모델(" + body.model + ")을 찾을 수 없습니다.");
      if (res.status === 429) throw new Error("요청이 많습니다. 잠시 뒤 다시 시도해 주세요.");
      if (!res.ok) throw new Error("AI 요청에 실패했습니다. (오류 " + res.status + ")");
      return res.json();
    }).then(function (data) {
      if (data.stop_reason === "refusal") throw finalError("AI가 이 요청을 거절했습니다. 내용을 바꿔 보세요.");
      if (data.stop_reason === "max_tokens") throw finalError("응답이 너무 길어 잘렸습니다. 요청 분량을 줄여 주세요.");
      var block = (data.content || []).filter(function (b) { return b.type === "text"; })[0];
      return parse(block ? block.text : "");
    });
  }

  // 키 연결 확인: 퀴즈 출제와 같은 모델·출력 형식으로 아주 짧게 호출해 키, 크레딧, 모델 권한을 함께 확인합니다.
  function aiCheckConnection(provider) {
    return aiCallOnce(provider, {
      model: C.quiz.ai.model,
      max_tokens: 200,
      output_config: {
        effort: "low",
        format: { type: "json_schema", schema: { type: "object", additionalProperties: false, required: ["ok"], properties: { ok: { type: "boolean" } } } }
      },
      messages: [{ role: "user", content: "연결 확인입니다. ok를 true로 답하세요." }]
    }, function () {
      return true;
    });
  }

  // 다른 섹션도 이 함수로 AI를 호출합니다. 등록된 키를 차례로 시도하고, 앞의 키가 실패하면 다음 키로 넘어갑니다.
  // parse는 응답 글자를 받아 결과를 돌려주며, 쓸 수 없는 응답이면 오류를 던집니다.
  function aiRequest(body, parse) {
    var providers = aiProviders();
    var failures = [];
    function attempt(i) {
      if (i >= providers.length) return Promise.reject(new Error(failures.join(" / ")));
      return aiCallOnce(providers[i], body, parse).then(function (result) {
        return { result: result, provider: providers[i].name, failures: failures };
      }, function (e) {
        failures.push(providers[i].name + ": " + e.message);
        if (e.isFinal) throw new Error(failures.join(" / "));
        return attempt(i + 1);
      });
    }
    return attempt(0);
  }

  // AI가 만드는 동안 보여 주는 삽질 애니메이션. 진행 상황은 옆의 글자로 알린다.

  function generateQuestions(topic, count, level) {
    var schema = {
      type: "object",
      additionalProperties: false,
      required: ["questions"],
      properties: {
        questions: {
          type: "array",
          items: {
            type: "object",
            additionalProperties: false,
            required: ["text", "choices", "answer"],
            properties: {
              text: { type: "string" },
              choices: { type: "array", items: { type: "string" } },
              answer: { type: "integer" }
            }
          }
        }
      }
    };
    return aiRequest({
      model: C.quiz.ai.model,
      max_tokens: 16000,
      output_config: { effort: "medium", format: { type: "json_schema", schema: schema } },
      messages: [{ role: "user", content: quizPrompt(topic, count, level) }]
    }, function (text) {
      var questions = [];
      try {
        questions = normalizeQuestions(JSON.parse(text.replace(/^\s*```(?:json)?|```\s*$/g, "")));
      } catch (e) {
        questions = [];
      }
      if (!questions.length) throw new Error("AI 응답에서 쓸 수 있는 문제를 찾지 못했습니다.");
      return questions;
    });
  }

  function quizLimitOf(q) {

  function renderQuestionEditor(bank) {
    var box = h("div", { class: "quiz-editor" });
    function save() {
      store.set("quizBank", bank);

    function draw() {
      box.textContent = "";
      bank.forEach(function (q, i) {
        var text = h("textarea", { rows: "2", "aria-label": (i + 1) + "번 문제" });

        var limit = h("input", { type: "number", min: "5", max: "120", "aria-label": (i + 1) + "번 제한 시간(초)" });
        limit.value = quizLimitOf(q);

        var del = h("button", { class: "mini-btn", type: "button", text: "삭제", "aria-label": (i + 1) + "번 문제 삭제" });
        del.addEventListener("click", function () {

          var radio = h("input", { type: "radio", name: "quiz-answer-" + i, "aria-label": (i + 1) + "번 정답: 보기 " + (ci + 1) });

          var input = h("input", { type: "text", "aria-label": (i + 1) + "번 보기 " + (ci + 1) });

  function hostOpen(questions, onError) {
    Promise.all([loadLib("peer"), loadLib("qr")]).then(function () {
      var attempts = 0;
      function start() {
        var code = String(100000 + (crypto.getRandomValues(new Uint32Array(1))[0] % 900000));
        var peer = new window.Peer(QUIZ_PREFIX + code);
        peer.on("open", function () {
          quizHost = { peer: peer, code: code, questions: questions, players: {}, index: -1, phase: "lobby", startedAt: 0, timer: null, shown: {} };
          window.addEventListener("beforeunload", hostLeaveGuard);
          drawQuiz();
        });
        peer.on("connection", hostConnection);
        peer.on("error", function (e) {
          if (e.type === "unavailable-id" && attempts++ < 3) return start();
          if (!quizHost) onError("연결 서버에 접속하지 못했습니다. 네트워크를 확인해 주세요.");
        });
      }
      start();
    }).catch(function () {
      onError("퀴즈 기능을 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.");
    });
  }

  function hostLeaveGuard(e) {
    if (quizHost && quizHost.phase !== "end") {
      e.preventDefault();
      e.returnValue = "";
    }
  }

  function hostPlayersList() {
    return Object.keys(quizHost.players).map(function (id) { return quizHost.players[id]; });
  }

  function hostRanking() {
    return hostPlayersList().slice().sort(function (a, b) { return b.score - a.score; });
  }

  function hostSend(player, message) {
    if (player.conn && player.conn.open) player.conn.send(message);
  }

  function hostQuestionMessage() {
    var q = quizHost.questions[quizHost.index];
    return {
      t: "question",
      q: quizHost.index,
      total: quizHost.questions.length,
      text: q.text,
      choices: q.choices,
      limit: q.limit,
      elapsed: (Date.now() - quizHost.startedAt) / 1000
    };
  }

  function hostRevealMessage(player) {
    var q = quizHost.questions[quizHost.index];
    var answer = player.answers[quizHost.index];
    return {
      t: "reveal",
      q: quizHost.index,
      answer: q.answer,
      text: q.text,
      choices: q.choices,
      choice: answer ? answer.choice : null,
      gained: answer ? answer.score : 0,
      score: player.score,
      rank: hostRanking().indexOf(player) + 1,
      players: hostPlayersList().length
    };
  }

  function hostEndMessage(player) {
    return { t: "end", score: player.score, rank: hostRanking().indexOf(player) + 1, players: hostPlayersList().length };
  }

  // 재접속한 학생에게 지금 단계의 화면을 다시 보낸다.
  function hostSyncPlayer(player) {
    if (quizHost.phase === "question") {
      var message = hostQuestionMessage();
      message.answered = !!player.answers[quizHost.index];
      hostSend(player, message);
    } else if (quizHost.phase === "reveal") hostSend(player, hostRevealMessage(player));
    else if (quizHost.phase === "end") hostSend(player, hostEndMessage(player));
  }

  function hostConnection(conn) {
    conn.on("data", function (msg) {
      if (!quizHost || !msg || typeof msg !== "object") return;
      if (msg.t === "hello") {
        var clientId = String(msg.clientId || "").slice(0, 40);
        var name = String(msg.name || "").trim().slice(0, 20);
        if (!clientId || !name) return;
        var player = quizHost.players[clientId];
        if (player) {
          player.conn = conn;
        } else {
          player = { id: clientId, name: name, studentId: String(msg.studentId || "").trim().slice(0, 12), conn: conn, score: 0, answers: {} };
          quizHost.players[clientId] = player;
        }
        conn.clientId = clientId;
        hostSend(player, { t: "welcome", name: player.name });
        hostSyncPlayer(player);
        drawQuizLive();
      } else if (msg.t === "answer") {
        hostAnswer(conn, msg);
      }
    });
    conn.on("close", function () { drawQuizLive(); });
  }

  function hostAnswer(conn, msg) {
    var player = quizHost.players[conn.clientId];
    if (!player || quizHost.phase !== "question" || msg.q !== quizHost.index) return;
    if (player.answers[msg.q] || !Number.isInteger(msg.choice) || msg.choice < 0 || msg.choice > 3) return;
    var q = quizHost.questions[msg.q];
    // 응답 시간은 학생 기기가 보낸 값을 믿지 않고 교수자 쪽에서 잰다.
    var seconds = Math.min(q.limit, (Date.now() - quizHost.startedAt) / 1000);
    var correct = msg.choice === q.answer;
    var score = correct ? Math.round(1000 * (1 - seconds / q.limit / 2)) : 0;
    player.answers[msg.q] = { choice: msg.choice, correct: correct, seconds: seconds, score: score };
    player.score += score;
    hostSend(player, { t: "answered" });
    var connected = hostPlayersList().filter(function (p) { return p.conn && p.conn.open; });
    if (connected.length && connected.every(function (p) { return p.answers[msg.q]; })) hostReveal();
    else drawQuizLive();
  }

  function hostNext() {
    quizHost.index += 1;
    if (quizHost.index >= quizHost.questions.length) return hostEnd();
    quizHost.phase = "question";
    quizHost.startedAt = Date.now();
    var q = quizHost.questions[quizHost.index];
    hostPlayersList().forEach(function (p) { hostSend(p, hostQuestionMessage()); });
    clearInterval(quizHost.timer);
    quizHost.timer = setInterval(function () {
      var left = q.limit - (Date.now() - quizHost.startedAt) / 1000;
      if (left <= 0) return hostReveal();
      var el = document.getElementById("quiz-host-timer");
      if (el) el.textContent = Math.ceil(left);
    }, 250);
    drawQuiz();
  }

  function hostReveal() {
    clearInterval(quizHost.timer);
    quizHost.phase = "reveal";
    hostPlayersList().forEach(function (p) { hostSend(p, hostRevealMessage(p)); });
    drawQuiz();
  }

  function hostEnd() {
    clearInterval(quizHost.timer);
    quizHost.phase = "end";
    hostPlayersList().forEach(function (p) { hostSend(p, hostEndMessage(p)); });
    drawQuiz();
  }

  function hostClose() {
    clearInterval(quizHost.timer);
    window.removeEventListener("beforeunload", hostLeaveGuard);
    quizHost.peer.destroy();
    quizHost = null;
    drawQuiz();
  }

  function quizResultCsv() {
    var ranking = hostRanking();
    var headers = ["순위", "이름", "학번", "총점", "문항", "문제", "학생 선택", "정답", "정오", "응답 시간(초)", "문항 점수"];
    var rows = [];
    ranking.forEach(function (p, rank) {
      quizHost.questions.forEach(function (q, i) {
        var a = p.answers[i];
        rows.push([
          rank + 1, p.name, p.studentId, p.score, i + 1, q.text,
          a ? q.choices[a.choice] : "미응답",
          q.choices[q.answer],
          a ? (a.correct ? "정답" : "오답") : "미응답",
          a ? a.seconds.toFixed(1) : "",
          a ? a.score : 0
        ]);
      });
    });
    downloadCsv("퀴즈결과", headers, rows);
  }
